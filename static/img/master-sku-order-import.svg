<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-label="An order line for LMP-2048 BK from Virtualstock is split by the master SKU map into master LMP-2048 and colour code BK. The ShopCtrl order row gets product LMP-2048 with Colour code BK, and the order is exported to your own system with the same product and colour code">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1d2430; }
    .mono { font-family: Consolas, "Courier New", monospace; }
    .small { font-size: 12px; fill: #5d6675; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; }
    .own { fill: #eef0f3; stroke: #5d6675; stroke-width: 1.5; }
    .own-t { fill: #5d6675; }
    .sc { fill: #e3edf8; stroke: #2b6cb0; stroke-width: 1.5; }
    .sc-t { fill: #2b6cb0; }
    .mp { fill: #f6eedf; stroke: #8a5a14; }
    .mp-t { fill: #8a5a14; }
    .frame { fill: none; stroke: #c9cfd9; stroke-dasharray: 4 3; }
    .arrow { fill: none; stroke: #5d6675; stroke-width: 1.6; }
    .head { fill: #5d6675; }
  </style>
  <rect x="0.5" y="0.5" width="899" height="229" rx="10" fill="#ffffff" stroke="#c9cfd9"/>

  <!-- Marketplace order line -->
  <rect class="mp" x="20" y="55" width="170" height="120" rx="8"/>
  <text class="label mp-t" x="34" y="80">ORDER LINE</text>
  <text class="small" x="34" y="98">from Virtualstock</text>
  <text class="mono" x="34" y="132" font-size="15" font-weight="600">LMP-2048 BK</text>
  <text class="small" x="34" y="156">Quantity 1</text>

  <path class="arrow" d="M192 115 H218"/><polygon class="head" points="218,110 226,115 218,120"/>

  <!-- Master SKU map -->
  <rect class="frame" x="230" y="55" width="180" height="120" rx="8"/>
  <text class="label" x="244" y="80">MASTER SKU MAP</text>
  <text class="small" x="244" y="98">splits the SKU</text>
  <rect class="sc" x="244" y="115" width="100" height="28" rx="4"/>
  <text class="mono" x="294" y="134" font-size="13" text-anchor="middle">LMP-2048</text>
  <rect class="mp" x="350" y="115" width="46" height="28" rx="4"/>
  <text class="mono" x="373" y="134" font-size="13" text-anchor="middle">BK</text>
  <text class="small" x="294" y="162" text-anchor="middle">master</text>
  <text class="small" x="373" y="162" text-anchor="middle">colour code</text>

  <path class="arrow" d="M412 115 H438"/><polygon class="head" points="438,110 446,115 438,120"/>

  <!-- ShopCtrl order row -->
  <rect class="sc" x="450" y="20" width="190" height="190" rx="8"/>
  <text class="label sc-t" x="464" y="45">SHOPCTRL · ORDER ROW</text>
  <text class="small" x="464" y="72">Product</text>
  <text class="mono" x="464" y="92" font-size="15" font-weight="600">LMP-2048</text>
  <text class="small" x="464" y="110">the master product</text>
  <line x1="464" y1="124" x2="626" y2="124" stroke="#c9cfd9"/>
  <text class="small" x="464" y="150">Order row property</text>
  <text x="464" y="172" font-size="13">Colour code: <tspan class="mono" font-weight="600">BK</tspan></text>

  <!-- Export arrow -->
  <text class="small" x="679" y="105" text-anchor="middle">export</text>
  <path class="arrow" d="M642 115 H708"/><polygon class="head" points="708,110 716,115 708,120"/>

  <!-- Your system -->
  <rect class="own" x="720" y="55" width="160" height="120" rx="8"/>
  <text class="label own-t" x="734" y="80">YOUR SYSTEM</text>
  <text class="mono" x="734" y="108" font-size="15" font-weight="600">LMP-2048</text>
  <text x="734" y="130" font-size="13">Colour code: <tspan class="mono" font-weight="600">BK</tspan></text>
  <text class="small" x="734" y="156">ships LMP-2048 in BK</text>
</svg>
