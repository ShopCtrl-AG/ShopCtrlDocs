trigger:
- main

variables:
  nodeVersion: '18.x'
  azureStorageAccount: 'shopctrldocs'
  containerName: '\$web' # Static websites use $web container

stages:
- stage: Build
  displayName: Build Docusaurus
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    # Install NodeJS 
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js'
    - task: Cache@2
      displayName: 'Cache NPM dependencies'
      inputs:
        key: '"node_modules" | "$(Agent.OS)" | package-lock.json'
        path: '$(System.DefaultWorkingDirectory)/node_modules'
        cacheHitVar: 'NPM_CACHE_RESTORED'
        restoreKeys: |
          "node_modules" | "$(Agent.OS)"
          "node_modules"
    - task: Cache@2
      displayName: 'Cache Docusaurus output'
      inputs:
        key: '"docusaurus_output" | "$(Agent.OS)" | docusaurus.config.js | package-lock.json'
        path: '$(System.DefaultWorkingDirectory)/.docusaurus'
        cacheHitVar: 'DOCUSAURUS_CACHE_RESTORED'
        restoreKeys: |
          "docusaurus_output" | "$(Agent.OS)"
          "docusaurus_output"
    - script: |
        npm install
      displayName: 'Install NPM dependencies'
      condition: ne(variables.NPM_CACHE_RESTORED, true)
      workingDirectory: $(System.DefaultWorkingDirectory)
    - script: |
        npm run build
      displayName: 'Build Docusaurus'
      workingDirectory: $(System.DefaultWorkingDirectory)
    - publish: $(System.DefaultWorkingDirectory)/build
      artifact: docusaurus-build

- stage: Deploy
  displayName: 'Deploy to Azure Storage'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: 'Deploy'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none
    - download: current
      artifact: docusaurus-build
    - task: AzureCLI@2
      displayName: 'Upload to Azure Storage'
      inputs:
        azureSubscription: '92577f71-89c4-4dd8-8685-2e5d159e18c5'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |

          # Install AzCopy if not already present
          if ! command -v azcopy &> /dev/null; then
            echo "Installing AzCopy..."
            curl -sL https://aka.ms/installazcopy-v10-linux | bash
            export PATH=$PATH:~/.azcopy
          fi
          
          ./azcopy sync "$(Pipeline.Workspace)/docusaurus-build/" \
          "https://$(azureStorageAccount).blob.core.windows.net/$(containerName)" \
          --recursive \
          --compare-hash="MD5" \
          --put-md5 \
          --delete-destination="true"
